[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "replace-with-a-long-random-value"
client_id = "replace-with-entra-application-client-id"
client_secret = "replace-with-entra-client-secret"
server_metadata_url = "https://login.microsoftonline.com/replace-with-tenant-id/v2.0/.well-known/openid-configuration"

[entra]
allowed_tenant_id = "replace-with-tenant-id"

# Optional local development login. Keep disabled outside local testing.
# Configure these as environment variables instead of committing credentials:
TECHADMIN_LOCAL_LOGIN_ENABLED=true
TECHADMIN_LOCAL_LOGIN_USERNAME=TechAdminTestUser
TECHADMIN_LOCAL_LOGIN_PASSWORD=<local-only-password>